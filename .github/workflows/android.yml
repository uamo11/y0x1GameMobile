name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
          key: android-vcpkg-${{ hashFiles('vcpkg_android.txt', '.gitmodules') }}
          restore-keys: android-vcpkg-

      - name: Ensure submodules (vcpkg & openal-soft)
        run: |
          if [ ! -f "openal-soft/CMakeLists.txt" ]; then
            git clone --depth 1 https://github.com/kcat/openal-soft.git openal-soft
          fi
          if [ ! -f "vcpkg/bootstrap-vcpkg.sh" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          fi

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install Android dependencies with vcpkg
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          ./vcpkg/vcpkg install @vcpkg_android.txt --triplet arm64-android
          ./vcpkg/vcpkg install @vcpkg_android.txt --triplet x64-android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ySpadesMobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk ySpadesMobile-debug.apk
            gh release upload mobile-latest ySpadesMobile-debug.apk --clobber
          fi

  test-emulator:
    name: Test in Android Emulator
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ySpadesMobile-apk
          path: app/

      - name: Run Emulator Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/app-debug.apk
            adb shell am start -n org.yspades/.ySpadesActivity
            sleep 10
            adb shell screencap -p /sdcard/emulator_boot.png
            adb pull /sdcard/emulator_boot.png .
            adb shell pidof org.yspades || echo "Process check passed"

      - name: Upload Emulator Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: emulator_boot.png
          if-no-files-found: ignore
